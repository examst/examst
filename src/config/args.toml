[show-answers]
title = "Show Answers"
description = "Whether or not to print answers."
default = "false"
types = ["bool"]
function = false

[question-numbering]
title = "Question Numbering"
description = "How question numbers should display independently. It takes the question-number counter."
default = '(it) => [#it.display("1.1")]'
types = ["function"]
function = false

[render-question-counter]
title = "Render Question Counter"
description = "How the question number is rendered in a question. Takes the question-number counter and question-numbering."
default = '(it, qn) => [Q#qn(it).]'
types = ["function"]
function = false

[render-name]
title = "Render Name"
description = "How the questio name is formatted. Either a preset name or a function taking a string."
default = '"parenthesized"'
types = ["str:parenthesized", "str:boxed", "str:bracketed", "str:raw", "function"]
function = false

[render-points]
title = "Render Points"
description = "How points are formatted. Either a preset name or a function taking a points dictionary."
default = '"parenthesized"'
types = ["str:parenthesized", "str:boxed", "str:bracketed", "function"]
function = false

[points-position]
title = "Points Position"
description = "Where points are displayed in the question layout. Options: inline, before-counter, before-name, after-body, left-margin, right-margin, or a custom function."
default = '"inline"'
types = ["str:inline", "str:before-counter", "str: before-name", "str:after-body", "str:left-margin", "str:right-margin", "str:two-sided", "str:two-sided-reversed", "function"]
function = false

[multi-choice-columns]
title = "Multi-Choice Columns"
description = "Default column count for multi-choice layouts. 1 = vertical, none = inline/wrapping, >1 = grid."
default = "1"
types = ["int", "type(none)"]
function = false

[multi-choice-marker]
title = "Multi-Choice Marker"
description = "Default marker style for multi-choice items."
default = '"bubble"'
types = ["str:bubble", "str:bubble-letter", "str:checkbox", "str:checkbox-letter", "str:none", "function"]
function = false

[multi-choice-label]
title = "Multi-Choice Label"
description = "Default numbering pattern for multi-choice labels."
default = '"A"'
types = ["str"]
function = false

[multi-choice-correct-emphasis]
title = "Multi-Choice Correct Emphasis"
description = "Function applied to correct answer text when show-answers is true."
default = "text.with(weight: \"bold\")"
types = ["function"]
function = false

[multi-choice-marker-font]
title = "Multi-Choice Marker Font"
description = "Font used for the letter inside bubble-letter / checkbox-letter markers. none = use document font."
default = "none"
types = ["str", "array", "type(none)"]
function = false

[solution-title]
title = "Solution Title"
description = "Content prepended to printed solutions. Set to none to disable."
default = '[*Solution:* ]'
types = ["content", "type(none)"]
function = false

[solution-emphasis]
title = "Solution Emphasis"
description = "Function applied to solution body text when printed."
default = "(it) => it"
types = ["function"]
function = false

[solution-frame]
title = "Solution Frame"
description = "How printed solutions are visually framed. Presets: boxed, shaded, none. Also accepts a dictionary of block() keys or a (content) -> content function."
default = '"boxed"'
types = ["str:boxed", "str:shaded", "str:none", "dictionary", "function"]
function = false

[solution-fill]
title = "Solution Fill"
description = "Default fill pattern for answer spaces. Presets: lines, grid, none. Also accepts a (height) -> content function."
default = '"lines"'
types = ["str:lines", "str:grid", "str:none", "function"]
function = false

[solution-height]
title = "Solution Height"
description = "Default height for answer spaces."
default = "2in"
types = ["length"]
function = false

[fill-in-width]
title = "Fill in the blank line width"
description = "Width used for fill in the blank lines."
default = "auto"
types = ["type(auto)", "length", "function"]
function = false
