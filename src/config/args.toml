[show-answers]
title = "Show Answers"
description = "Whether or not to print answers."
default = "false"
types = ["bool"]
function = false

[render-question-counter]
title = "Render Question Counter"
description = "How the question counter is rendered. Takes the question-number counter."
default = '(it) => [Q#it.display("1.1.")]'
types = ["function"]
function = false

[render-points]
title = "Render Points"
description = "How points are formatted. Takes a dictionary mapping point category names to their values, returns content."
default = '''
(points-dict) => {
  let point-texts = points-dict.pairs().map(((k, v)) => [#v #k])
  if point-texts.len() > 0 [(#point-texts.join(", "))]
}'''
types = ["function"]
function = false

[points-position]
title = "Points Position"
description = "Where points are displayed in the question layout. Options: inline, before-counter, after-body, left-margin, right-margin, or a custom function."
default = '"inline"'
types = ["str", "function"]
function = false
