[show-answers]
title = "Show Answers"
description = "Whether or not to print answers."
default = "false"
types = ["bool"]
function = false

[render-question-counter]
title = "Render Question Counter"
description = "How the question counter is rendered. Takes the question-number counter."
default = '(it) => [Q#it.display("1.1.")]'
types = ["function"]
function = false

[render-points]
title = "Render Points"
description = "How points are formatted. Either a preset name or a function taking a points dictionary."
default = '"parenthesized"'
types = ["str:parenthesized", "str:boxed", "str:bracketed", "function"]
function = false

[points-position]
title = "Points Position"
description = "Where points are displayed in the question layout. Options: inline, before-counter, after-body, left-margin, right-margin, or a custom function."
default = '"inline"'
types = ["str:inline", "str:before-counter", "str:after-body", "str:left-margin", "str:right-margin", "str:two-sided", "str:two-sided-reversed", "function"]
function = false

[multi-choice-columns]
title = "Multi-Choice Columns"
description = "Default column count for multi-choice layouts. 1 = vertical, none = inline/wrapping, >1 = grid."
default = "1"
types = ["int", "type(none)"]
function = false

[multi-choice-marker]
title = "Multi-Choice Marker"
description = "Default marker style for multi-choice items."
default = '"bubble"'
types = ["str:bubble", "str:bubble-letter", "str:checkbox", "str:checkbox-letter", "str:none", "function"]
function = false

[multi-choice-label]
title = "Multi-Choice Label"
description = "Default numbering pattern for multi-choice labels."
default = '"A"'
types = ["str"]
function = false

[multi-choice-correct-emphasis]
title = "Multi-Choice Correct Emphasis"
description = "Function applied to correct answer text when show-answers is true."
default = "text.with(weight: \"bold\")"
types = ["function"]
function = false

[multi-choice-marker-font]
title = "Multi-Choice Marker Font"
description = "Font used for the letter inside bubble-letter / checkbox-letter markers. none = use document font."
default = "none"
types = ["str", "array", "type(none)"]
function = false
